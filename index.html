واجهة تسجيل الدخول — Center Albaziki

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Center Albaziki</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
body{
  font-family:Arial, sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%, #27303d 0%, #111722 35%, #080b11 75%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
/* إضاءة متحركة بالخلفية */
body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;
  background:rgba(212,160,65,.12);
  filter:blur(100px);
  top:-180px;
  left:50%;
  transform:translateX(-50%);
  animation:lightMove 5s ease-in-out infinite alternate;
}
@keyframes lightMove{
  from{
    transform:translateX(-50%) scale(.8);
    opacity:.5;
  }
  to{
    transform:translateX(-50%) scale(1.3);
    opacity:1;
  }
}
.container{
  width:100%;
  max-width:500px;
  min-height:100vh;
  padding:30px 25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
}
/* الشعار */
.logo{
  width:240px;
  height:240px;
  object-fit:cover;
  border-radius:20px;
  filter:
    drop-shadow(0 0 15px rgba(231,181,76,.35))
    drop-shadow(0 0 40px rgba(231,181,76,.15));
  animation:
    logoEnter 1.3s ease,
    logoFloat 4s ease-in-out infinite;
}
@keyframes logoEnter{
  from{
    opacity:0;
    transform:scale(.7) translateY(-40px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}
@keyframes logoFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-8px);
  }
}
h1{
  margin-top:18px;
  font-size:28px;
  color:#e8bd68;
  text-shadow:0 0 15px rgba(232,189,104,.35);
  animation:fadeUp 1s ease .3s both;
}
.subtitle{
  margin-top:8px;
  color:#ddd;
  font-size:16px;
  animation:fadeUp 1s ease .5s both;
}
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
/* الأزرار */
.login-buttons{
  width:100%;
  margin-top:30px;
}
.login-btn{
  width:100%;
  height:65px;
  margin-bottom:16px;
  border-radius:15px;
  border:1px solid rgba(224,179,90,.55);
  background:rgba(20,23,31,.75);
  color:white;
  font-size:17px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  transition:.3s;
  backdrop-filter:blur(10px);
  animation:slideUp .8s ease both;
}
.login-btn:nth-child(1){
  animation-delay:.7s;
}
.login-btn:nth-child(2){
  animation-delay:.9s;
}
.login-btn:hover{
  transform:translateY(-4px) scale(1.01);
  border-color:#e7bd63;
  box-shadow:0 8px 30px rgba(218,170,75,.18);
}
.login-btn:active{
  transform:scale(.97);
}
.google{
  font-size:25px;
  font-weight:bold;
  color:#4285F4;
}
.apple{
  font-size:28px;
  color:white;
}
@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
/* أو */
.or{
  width:100%;
  display:flex;
  align-items:center;
  gap:15px;
  margin:8px 0 20px;
  color:#aaa;
}
.or::before,
.or::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(
    90deg,
    transparent,
    #8d6b32,
    transparent
  );
}
/* الحقول */
.input{
  width:100%;
  height:60px;
  margin-bottom:13px;
  padding:0 20px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(15,18,25,.75);
  color:white;
  font-size:16px;
  outline:none;
  transition:.3s;
}
.input:focus{
  border-color:#e5b95e;
  box-shadow:0 0 20px rgba(229,185,94,.12);
}
.input::placeholder{
  color:#888;
}
/* زر الدخول */
.main-btn{
  width:100%;
  height:65px;
  margin-top:5px;
  border:0;
  border-radius:15px;
  background:linear-gradient(
    135deg,
    #e9bf68,
    #b77d28
  );
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(210,157,55,.25);
  transition:.3s;
  animation:pulse 3s ease-in-out infinite;
}
.main-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(210,157,55,.4);
}
.main-btn:active{
  transform:scale(.97);
}
@keyframes pulse{
  0%,100%{
    box-shadow:0 8px 30px rgba(210,157,55,.2);
  }
  50%{
    box-shadow:0 8px 45px rgba(210,157,55,.4);
  }
}
.bottom{
  margin-top:25px;
  color:#aaa;
  font-size:14px;
}
.bottom span{
  color:#e7b85c;
  cursor:pointer;
}
/* شاشات صغيرة */
@media(max-width:400px){
  .container{
    padding:20px;
  }
  .logo{
    width:190px;
    height:190px;
  }
  h1{
    font-size:24px;
  }
}
</style>
</head>
<body>
<div class="container">
  <!-- الصورة -->
  <img src="logo.jpg" class="logo" alt="Center Albaziki">
  <h1>مـرحـبـاً بـك</h1>
  <div class="subtitle">
    سجل دخولك لإدارة المخزون
  </div>
  <div class="login-buttons">
    <button class="login-btn" onclick="googleLogin()">
      <span class="google">G</span>
      تسجيل الدخول بحساب Google
    </button>
    <button class="login-btn" onclick="appleLogin()">
      <span class="apple">●</span>
      تسجيل الدخول بحساب Apple
    </button>
    <div class="or">
      <span>أو</span>
    </div>
    <input
      id="phone"
      class="input"
      type="text"
      placeholder="رقم الهاتف"
    >
    <input
      id="password"
      class="input"
      type="password"
      placeholder="كلمة المرور"
    >
    <button class="main-btn" onclick="login()">
      تسجيل الدخول
    </button>
  </div>
  <div class="bottom">
    ليس لديك حساب؟
    <span onclick="register()">سجل الآن</span>
  </div>
</div>
<script>
function login(){
  let phone =
    document.getElementById("phone").value.trim();
  let password =
    document.getElementById("password").value.trim();
  if(phone === "" || password === ""){
    alert("يرجى إدخال رقم الهاتف وكلمة المرور");
    return;
  }
  alert("تم تسجيل الدخول");
  // لاحقاً نربطها بنظام تسجيل دخول حقيقي
}
function googleLogin(){
  alert(
    "تسجيل الدخول بواسطة Google سيتم تفعيله عند ربط Firebase"
  );
}
function appleLogin(){
  alert(
    "تسجيل الدخول بواسطة Apple سيتم تفعيله عند ربط Firebase"
  );
}
function register(){
  alert("صفحة إنشاء الحساب سيتم إضافتها لاحقاً");
}
</script>
</body>
</html>
