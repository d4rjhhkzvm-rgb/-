<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Center Albaziki</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#05070a;
  color:white;
}
body{
  overflow-x:hidden;
}
/* الخلفية */
.page{
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 12%,
      rgba(220,175,75,.20),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #030405,
      #11151c 48%,
      #050608
    );
}
/* إضاءة متحركة */
.glow{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:rgba(214,166,67,.12);
  filter:blur(75px);
  top:-100px;
  left:50%;
  transform:translateX(-50%);
  animation:glow 5s ease-in-out infinite alternate;
}
@keyframes glow{
  from{
    transform:translateX(-50%) scale(.8);
    opacity:.4;
  }
  to{
    transform:translateX(-50%) scale(1.25);
    opacity:1;
  }
}
/* نقاط رقمية */
.dot{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#e5bd68;
  box-shadow:0 0 12px #e5bd68;
  opacity:.7;
  animation:rise linear infinite;
}
.dot:nth-child(1){left:8%;animation-duration:9s;bottom:-10px}
.dot:nth-child(2){left:20%;animation-duration:12s;bottom:-20px}
.dot:nth-child(3){left:35%;animation-duration:8s;bottom:-15px}
.dot:nth-child(4){left:52%;animation-duration:14s;bottom:-10px}
.dot:nth-child(5){left:68%;animation-duration:10s;bottom:-20px}
.dot:nth-child(6){left:83%;animation-duration:13s;bottom:-15px}
.dot:nth-child(7){left:94%;animation-duration:9s;bottom:-10px}
@keyframes rise{
  from{
    transform:translateY(0);
    opacity:0;
  }
  20%{opacity:.8}
  80%{opacity:.8}
  to{
    transform:translateY(-110vh);
    opacity:0;
  }
}
/* البطاقة */
.card{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:2;
  padding:24px 20px 22px;
  border-radius:28px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );
  border:1px solid rgba(224,181,91,.30);
  box-shadow:
    0 25px 80px rgba(0,0,0,.75),
    0 0 45px rgba(214,166,67,.08);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  animation:cardIn .8s ease both;
}
@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
/* الخط الذهبي */
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:18%;
  width:64%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #e4ba62,
    transparent
  );
  animation:line 3s ease-in-out infinite;
}
@keyframes line{
  0%,100%{opacity:.25}
  50%{opacity:1}
}
/* الشعار */
.logo-wrap{
  width:115px;
  height:115px;
  margin:2px auto 12px;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(
    135deg,
    #8b641e,
    #f0cf78,
    #9b711f
  );
  box-shadow:
    0 0 30px rgba(226,181,82,.20);
  animation:logo 4s ease-in-out infinite;
}
.logo{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
  background:#090b0f;
}
@keyframes logo{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-5px);
  }
}
.brand{
  text-align:center;
  color:#e8c473;
  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;
}
.subtitle{
  text-align:center;
  color:#9b9b9b;
  font-size:13px;
  margin-top:7px;
}
.welcome{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  margin:22px 0 16px;
}
/* الأزرار */
.social{
  width:100%;
  height:54px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.16);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:15px;
  cursor:pointer;
  transition:.25s;
}
.social:active{
  transform:scale(.97);
}
.google{
  background:#fff;
  color:#151515;
}
.apple{
  background:#050505;
  color:white;
}
.google-icon{
  color:#4285f4;
  font-weight:bold;
  font-size:20px;
}
.apple-icon{
  font-size:23px;
}
/* الفاصل */
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 0;
  color:#777;
  font-size:13px;
}
.divider::before,
.divider::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(
    90deg,
    transparent,
    #444,
    transparent
  );
}
/* الهاتف */
.phone-row{
  display:flex;
  direction:ltr;
  gap:8px;
  margin-bottom:10px;
}
.country{
  width:115px;
  height:54px;
  border-radius:13px;
  border:1px solid #35383d;
  background:#0c0f14;
  color:white;
  padding:0 8px;
  outline:none;
  font-size:14px;
}
.phone{
  flex:1;
  height:54px;
  border-radius:13px;
  border:1px solid #35383d;
  background:#0c0f14;
  color:white;
  padding:0 15px;
  font-size:16px;
  outline:none;
  text-align:left;
}
.country:focus,
.phone:focus,
.password:focus{
  border-color:#dcb35c;
  box-shadow:0 0 18px rgba(220,179,92,.10);
}
/* كلمة المرور */
.password{
  width:100%;
  height:54px;
  border-radius:13px;
  border:1px solid #35383d;
  background:#0c0f14;
  color:white;
  padding:0 15px;
  font-size:16px;
  outline:none;
  margin-bottom:9px;
}
.password::placeholder,
.phone::placeholder{
  color:#777;
}
/* زر الدخول */
.login{
  width:100%;
  height:56px;
  border:0;
  border-radius:14px;
  background:
    linear-gradient(
      110deg,
      #9d7122,
      #f0cb70,
      #b68429,
      #f0cb70
    );
  background-size:300% 100%;
  color:#17130a;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  animation:goldMove 5s linear infinite;
  transition:.25s;
}
@keyframes goldMove{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}
.login:active{
  transform:scale(.97);
}
.forgot{
  display:block;
  text-align:center;
  color:#d9b35d;
  font-size:13px;
  margin-top:13px;
  cursor:pointer;
}
.error{
  color:#ff7777;
  text-align:center;
  font-size:13px;
  margin-top:9px;
  min-height:18px;
}
.secure{
  text-align:center;
  color:#666;
  font-size:11px;
  margin-top:17px;
}
/* شاشة التطبيق */
#app{
  display:none;
  width:100%;
  max-width:900px;
  min-height:100vh;
  padding:20px;
  margin:auto;
}
.app-title{
  color:#e8c473;
  text-align:center;
  margin-bottom:20px;
}
.box{
  background:rgba(20,22,27,.9);
  border:1px solid rgba(224,181,91,.25);
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}
.box input{
  width:100%;
  height:52px;
  margin:5px 0;
  padding:0 14px;
  border-radius:12px;
  border:1px solid #333;
  background:#090b0f;
  color:white;
}
.gold-button{
  width:100%;
  height:54px;
  border:0;
  border-radius:12px;
  margin-top:8px;
  background:#d5aa4d;
  color:#111;
  font-weight:bold;
  font-size:16px;
}
.item{
  background:#111419;
  border:1px solid #303238;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}
.item img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:13px;
  display:block;
  margin-bottom:10px;
}
.logout{
  display:block;
  margin:0 auto 20px;
  padding:10px 20px;
  border:1px solid #444;
  background:#15171b;
  color:white;
  border-radius:10px;
}
/* تحسين إضافي للشاشات الصغيرة */
@media(max-width:360px){
  .card{
    padding:20px 15px;
  }
  .logo-wrap{
    width:95px;
    height:95px;
  }
  .brand{
    font-size:18px;
  }
  .welcome{
    font-size:22px;
  }
  .country{
    width:105px;
  }
}
</style>
</head>
<body>
<div class="page">
  <div class="glow"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <!-- تسجيل الدخول -->
  <div class="card" id="loginPage">
    <div class="logo-wrap">
      <img
        src="logo.jpg"
        class="logo"
        alt="Center Albaziki">
    </div>
    <div class="brand">
      CENTER ALBAZIKI
    </div>
    <div class="subtitle">
      إدارة المخزون باحترافية
    </div>
    <div class="welcome">
      مرحباً بك
    </div>
    <button class="social google" onclick="googleLogin()">
      <span class="google-icon">G</span>
      تسجيل الدخول باستخدام Google
    </button>
    <button class="social apple" onclick="appleLogin()">
      <span class="apple-icon"></span>
      تسجيل الدخول باستخدام Apple
    </button>
    <div class="divider">
      <span>أو</span>
    </div>
    <div class="phone-row">
      <select id="country" class="country">
        <option value="+963">🇸🇾 +963</option>
        <option value="+966">🇸🇦 +966</option>
        <option value="+971">🇦🇪 +971</option>
        <option value="+974">🇶🇦 +974</option>
        <option value="+965">🇰🇼 +965</option>
        <option value="+973">🇧🇭 +973</option>
        <option value="+968">🇴🇲 +968</option>
        <option value="+962">🇯🇴 +962</option>
        <option value="+961">🇱🇧 +961</option>
        <option value="+90">🇹🇷 +90</option>
        <option value="+49">🇩🇪 +49</option>
        <option value="+33">🇫🇷 +33</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+39">🇮🇹 +39</option>
        <option value="+34">🇪🇸 +34</option>
        <option value="+1">🇺🇸 +1</option>
        <option value="+1">🇨🇦 +1</option>
        <option value="+61">🇦🇺 +61</option>
        <option value="+81">🇯🇵 +81</option>
        <option value="+82">🇰🇷 +82</option>
        <option value="+86">🇨🇳 +86</option>
      </select>
      <input
        id="phone"
        class="phone"
        type="tel"
        inputmode="numeric"
        placeholder="رقم الهاتف">
    </div>
    <input
      id="password"
      class="password"
      type="password"
      placeholder="كلمة المرور">
    <button class="login" onclick="login()">
      تسجيل الدخول
    </button>
    <div id="error" class="error"></div>
    <div class="forgot" onclick="forgotPassword()">
      نسيت كلمة المرور؟
    </div>
    <div class="secure">
      🔒 تسجيل دخول آمن ومشفر
    </div>
  </div>
  <!-- لوحة المخزون -->
  <div id="app">
    <h1 class="app-title">
      👟 مخزون سنتر البازكه
    </h1>
    <button class="logout" onclick="logout()">
      تسجيل الخروج
    </button>
    <div class="box">
      <input
        id="model"
        placeholder="رقم الموديل *">
      <input
        id="supplier"
        placeholder="اسم المورد">
      <input
        id="color"
        placeholder="اللون">
      <input
        id="qty"
        type="number"
        placeholder="عدد الكراتين">
      <input
        id="image"
        type="file"
        accept="image/*">
      <button class="gold-button" onclick="addModel()">
        إضافة موديل
      </button>
      <div id="formError" class="error"></div>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
let shoes =
  JSON.parse(
    localStorage.getItem("shoes") || "[]"
  );
function login(){
  const country =
    document.getElementById("country").value;
  const phone =
    document.getElementById("phone").value.trim();
  const password =
    document.getElementById("password").value.trim();
  const error =
    document.getElementById("error");
  if(!phone){
    error.textContent =
      "يرجى إدخال رقم الهاتف.";
    return;
  }
  if(!password){
    error.textContent =
      "يرجى إدخال كلمة المرور.";
    return;
  }
  const fullNumber =
    country + phone;
  error.textContent =
    "";
  /*
    مؤقتاً:
    هذا المكان سنربطه بـ Firebase
    لإرسال رمز SMS الحقيقي.
  */
  alert(
    "رقمك: " + fullNumber +
    "\nسيتم ربط التحقق الحقيقي عبر SMS في الخطوة التالية."
  );
}
function googleLogin(){
  alert(
    "Google جاهز للربط الحقيقي عبر Firebase."
  );
}
function appleLogin(){
  alert(
    "Apple جاهز للربط الحقيقي عبر Firebase."
  );
}
function forgotPassword(){
  alert(
    "استعادة كلمة المرور سيتم ربطها مع نظام الحسابات."
  );
}
function logout(){
  document.getElementById("app").style.display="none";
  document.getElementById("loginPage").style.display="block";
}
function addModel(){
  const model =
    document.getElementById("model").value.trim();
  const supplier =
    document.getElementById("supplier").value.trim();
  const color =
    document.getElementById("color").value.trim();
  const qty =
    document.getElementById("qty").value.trim();
  const imageInput =
    document.getElementById("image");
  const error =
    document.getElementById("formError");
  if(!model){
    error.textContent =
      "⚠️ لازم تكتب رقم الموديل أولاً.";
    return;
  }
  error.textContent="";
  const file =
    imageInput.files[0];
  if(file){
    const reader =
      new FileReader();
    reader.onload=function(e){
      saveModel(
        model,
        supplier,
        color,
        qty,
        e.target.result
      );
    };
    reader.readAsDataURL(file);
  }else{
    saveModel(
      model,
      supplier,
      color,
      qty,
      ""
    );
  }
}
function saveModel(
  model,
  supplier,
  color,
  qty,
  image
){
  shoes.push({
    model,
    supplier,
    color,
    qty,
    image
  });
  localStorage.setItem(
    "shoes",
    JSON.stringify(shoes)
  );
  document.getElementById("model").value="";
  document.getElementById("supplier").value="";
  document.getElementById("color").value="";
  document.getElementById("qty").value="";
  document.getElementById("image").value="";
  showModels();
}
function showModels(){
  let html="";
  shoes.forEach(function(s){
    html += `
      <div class="item">
        ${
          s.image
          ?
          `<img src="${s.image}" alt="صورة الموديل">`
          :
          ""
        }
        <div>
          <b>الموديل:</b>
          ${safe(s.model)}
        </div>
        <div>
          <b>المورد:</b>
          ${safe(s.supplier)}
        </div>
        <div>
          <b>اللون:</b>
          ${safe(s.color)}
        </div>
        <div>
          <b>الكراتين:</b>
          ${safe(s.qty)}
        </div>
      </div>
    `;
  });
  document.getElementById("list").innerHTML =
    html;
}
function safe(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
showModels();
</script>
</body>
</html>
