<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CENTER ALBAZIKI</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
height:100vh;
background:
radial-gradient(circle at top,#b8862c33,transparent 40%),
linear-gradient(135deg,#050505,#151515);
display:flex;
justify-content:center;
align-items:center;
color:white;
}


.container{
width:90%;
max-width:420px;
text-align:center;
background:#111111cc;
padding:35px;
border-radius:25px;
border:1px solid #c9a22755;
box-shadow:0 0 40px #c9a22744;
animation:show 1s ease;
}


@keyframes show{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}


.logo{
width:150px;
height:150px;
object-fit:contain;
animation:glow 3s infinite;
}


@keyframes glow{

50%{
filter:drop-shadow(0 0 25px gold);
}

}


h1{
color:#d4af37;
font-size:30px;
margin:15px 0 5px;
}


p{
color:#ccc;
}


button{

margin-top:25px;
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
background:linear-gradient(90deg,#d4af37,#fff0a8);
color:#111;
font-weight:bold;

}


button:hover{
transform:scale(1.03);
}


#dashboard{

display:none;
width:95%;
max-width:900px;

}


.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;

}


.card{

background:#111;
padding:25px;
border-radius:20px;
border:1px solid #d4af3755;
text-align:center;
font-size:20px;

}


</style>

</head>


<body>


<div class="container" id="login">

<img class="logo" src="logo.png">


<h1>
CENTER ALBAZIKI
</h1>

<p>
Inventory & Sales Management
</p>


<button onclick="googleLogin()">
تسجيل الدخول بواسطة Google
</button>


<p id="result"></p>


</div>



<div id="dashboard">


<h1>
أهلاً بك في لوحة التحكم
</h1>


<div class="cards">

<div class="card">
📦 المنتجات
</div>

<div class="card">
💰 المبيعات
</div>

<div class="card">
👥 العملاء
</div>

<div class="card">
🚚 الموردين
</div>

<div class="card">
📊 التقارير
</div>

<div class="card">
⚙️ الإعدادات
</div>


</div>

</div>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
GoogleAuthProvider,
signInWithPopup

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyBPiLbUPClwrvbvzmvEaaIu2FaAWWsA4TI",

authDomain:"centeralbaziki.firebaseapp.com",

projectId:"centeralbaziki",

storageBucket:"centeralbaziki.firebasestorage.app",

messagingSenderId:"368079353950",

appId:"1:368079353950:web:adb51c325e4208aba59ccf"

};



const app=initializeApp(firebaseConfig);


const auth=getAuth(app);


const provider=new GoogleAuthProvider();



window.googleLogin=function(){


signInWithPopup(auth,provider)

.then((result)=>{


document.getElementById("login").style.display="none";

document.getElementById("dashboard").style.display="block";


})


.catch((error)=>{


document.getElementById("result").innerHTML=
error.message;


});


}



</script>


</body>
</html>
