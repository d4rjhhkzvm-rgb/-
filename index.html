<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Login Test</title>
</head>

<body style="background:#111;color:white;text-align:center;padding-top:100px;font-family:Arial">

<h2>تسجيل دخول Google</h2>

<button onclick="googleLogin()" style="padding:15px 30px;font-size:18px">
تسجيل الدخول باستخدام Google
</button>

<p id="result"></p>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyBPiLbUPClwrvbvzmvEaaIu2FaAWWsA4TI",
authDomain: "centeralbaziki.firebaseapp.com",
projectId: "centeralbaziki",
storageBucket: "centeralbaziki.firebasestorage.app",
messagingSenderId: "368079353950",
appId: "1:368079353950:web:adb51c325e4208aba59ccf"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


window.googleLogin = function(){

signInWithPopup(auth, provider)

.then((result)=>{

document.getElementById("result").innerHTML =
"تم الدخول: " + result.user.email;

})

.catch((error)=>{

document.getElementById("result").innerHTML =
error.message;

});

}


</script>

</body>
</html>
