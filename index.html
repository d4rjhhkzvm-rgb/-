<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Center Albaziki</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#05070a;
color:white;
min-height:100vh;
}

.page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at top,#b8892d33,transparent 35%),
linear-gradient(145deg,#030405,#11151c);
}


.card{
width:100%;
max-width:430px;
background:#10141bcc;
border:1px solid #d6aa4d55;
border-radius:25px;
padding:25px;
box-shadow:0 20px 60px #000;
}


.logo{
width:110px;
height:110px;
border-radius:50%;
display:block;
margin:auto;
object-fit:cover;
border:4px solid #d9b45b;
}


.brand{
text-align:center;
color:#e8c473;
font-size:24px;
font-weight:bold;
margin-top:15px;
}


.subtitle{
text-align:center;
color:#aaa;
margin-top:8px;
}


h2{
text-align:center;
margin:25px 0;
}


.social{
width:100%;
height:55px;
border-radius:14px;
border:0;
font-size:16px;
cursor:pointer;
}


.google{
background:white;
color:#222;
}


#app{
display:none;
width:100%;
max-width:900px;
margin:auto;
padding:20px;
}


.app-title{
text-align:center;
color:#e8c473;
}


.box{
background:#10141b;
border:1px solid #d6aa4d55;
padding:20px;
border-radius:20px;
}


input{
width:100%;
height:50px;
margin:6px 0;
border-radius:12px;
border:1px solid #333;
background:#080a0d;
color:white;
padding:0 15px;
}


button{
cursor:pointer;
}


.add{
width:100%;
height:50px;
background:#d5aa4d;
border:0;
border-radius:12px;
font-weight:bold;
}


.item{
background:#151920;
padding:15px;
border-radius:15px;
margin-top:12px;
}


.logout{
margin:20px auto;
display:block;
padding:10px 25px;
border-radius:10px;
background:#222;
color:white;
border:1px solid #555;
}


</style>

</head>


<body>


<div class="page">


<div class="card" id="loginPage">

<img src="logo.jpg" class="logo">


<div class="brand">
CENTER ALBAZIKI
</div>


<div class="subtitle">
إدارة المخزون باحترافية
</div>


<h2>
مرحباً بك
</h2>


<button class="social google" onclick="googleLogin()">
🔵 تسجيل الدخول باستخدام Google
</button>


</div>
