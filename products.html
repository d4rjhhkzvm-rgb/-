<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة موديل - CENTER ALBAZIKI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <h1 style="color:#d4af37;text-align:center;">
        📦 إضافة موديل جديد
    </h1>

    <div style="background:#1d1d1d;padding:20px;border-radius:20px;">

        <label>رقم الموديل</label>
        <input
            id="model"
            class="search"
            type="text"
            placeholder="مثال: 201"
        >

        <label>اسم الشركة</label>
        <input
            id="company"
            class="search"
            type="text"
            placeholder="اسم الشركة المصنعة"
        >

        <label>اسم المورد</label>
        <input
            id="supplier"
            class="search"
            type="text"
            placeholder="اسم المورد"
        >

        <label>عدد الأزواج داخل الكرتونة</label>
        <input
            id="pairsPerCarton"
            class="search"
            type="number"
            min="1"
            placeholder="مثال: 8"
        >

        <label>سعر رأس المال للزوج بالدولار</label>
        <input
            id="costPerPair"
            class="search"
            type="number"
            min="0"
            step="0.01"
            placeholder="مثال: 6.50"
        >

        <label>ملاحظات</label>
        <textarea
            id="notes"
            class="search"
            placeholder="أي ملاحظات عن الموديل"
            style="width:100%;min-height:100px;resize:vertical;"
        ></textarea>

        <button
            onclick="saveProduct()"
            style="
            width:100%;
            padding:15px;
            background:#d4af37;
            border:none;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            "
        >
            💾 حفظ الموديل
        </button>

        <p
            id="message"
            style="
            text-align:center;
            margin-top:15px;
            "
        ></p>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>

<script src="products.js"></script>

</body>
</html>
