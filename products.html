<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة موديل - CENTER ALBAZIKI</title>

<link rel="stylesheet" href="style.css">

<style>
.product-page {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}

.product-title {
    text-align: center;
    color: #d4af37;
    font-size: 28px;
    margin: 20px 0 30px;
}

.product-form {
    background: #1d1d1d;
    border: 1px solid #d4af37;
    border-radius: 22px;
    padding: 22px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    color: #d4af37;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

.form-group input,
.form-group textarea {
    box-sizing: border-box;
    width: 100%;
    display: block;
    padding: 14px;
    border: 1px solid #555;
    border-radius: 12px;
    background: #fff;
    color: #111;
    font-size: 17px;
    font-family: Arial;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.save-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #d4af37;
    color: #111;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.save-btn:active {
    transform: scale(0.98);
}
</style>

</head>

<body>

<div class="product-page">

    <h1 class="product-title">
        📦 إضافة موديل جديد
    </h1>

    <div class="product-form">

        <div class="form-group">
            <label>🔢 رقم الموديل</label>
            <input
                id="model"
                type="text"
                placeholder="مثال: 201"
            >
        </div>

        <div class="form-group">
            <label>🏭 اسم الشركة</label>
            <input
                id="company"
                type="text"
                placeholder="اسم الشركة"
            >
        </div>

        <div class="form-group">
            <label>🚚 اسم المورد</label>
            <input
                id="supplier"
                type="text"
                placeholder="اسم المورد"
            >
        </div>

        <div class="form-group">
            <label>📦 عدد الأزواج داخل الكرتونة</label>
            <input
                id="pairsPerCarton"
                type="number"
                min="1"
                placeholder="مثال: 8"
            >
        </div>

        <div class="form-group">
            <label>💵 سعر رأس المال للزوج بالدولار</label>
            <input
                id="costPerPair"
                type="number"
                min="0"
                step="0.01"
                placeholder="مثال: 6.50"
            >
        </div>

        <div class="form-group">
            <label>📝 ملاحظات</label>
            <textarea
                id="notes"
                placeholder="اكتب أي ملاحظات عن الموديل..."
            ></textarea>
        </div>

        <button
            id="saveProductBtn"
            class="save-btn"
            onclick="saveProduct()"
        >
            💾 حفظ الموديل
        </button>

        <p id="message" style="text-align:center;"></p>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="products.js"></script>

</body>
</html>
