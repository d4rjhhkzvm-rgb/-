<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موديل جديد - CENTER ALBAZIKI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.product-page{
    max-width:650px;
    margin:auto;
    padding:20px;
}

.title{
    text-align:center;
    color:#d4af37;
    margin:20px 0 25px;
}

.form-box{
    background:#1d1d1d;
    border:1px solid #d4af37;
    border-radius:20px;
    padding:20px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    color:#d4af37;
    font-weight:bold;
    margin-bottom:8px;
}

.field input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #555;
    font-size:17px;
    background:white;
    color:#111;
}

/* الصورة */

.image-box{
    text-align:center;
    margin-bottom:20px;
}

.image-preview{
    width:180px;
    height:180px;
    margin:0 auto 12px;
    border-radius:18px;
    border:2px dashed #d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#111;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.image-preview span{
    color:#aaa;
}

.image-input{
    color:white;
    width:100%;
}

/* الألوان */

.color-title{
    color:#d4af37;
    font-weight:bold;
    margin-bottom:12px;
    font-size:18px;
}

.color-row{
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    padding:12px;
    margin-bottom:12px;
}

.color-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.color-name{
    flex:1;
}

.color-name select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #555;
    font-size:16px;
}

.delete-color{
    width:44px;
    height:44px;
    border:none;
    border-radius:10px;
    background:#a51d1d;
    color:white;
    font-size:20px;
}

/* − [ الرقم ] + */

.color-stock{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.stock-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:12px;
    color:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.plus-btn{
    background:#168a3b;
}

.minus-btn{
    background:#a51d1d;
}

.quantity{
    width:120px;
    height:52px;
    border-radius:12px;
    border:1px solid #777;
    background:white;
    color:#111;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.quantity-label{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.add-color{
    width:100%;
    padding:14px;
    border:1px solid #d4af37;
    background:transparent;
    color:#d4af37;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

/* الحسابات */

.summary{
    margin-top:22px;
    background:#111;
    border-radius:15px;
    padding:18px;
    border:1px solid #333;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #333;
}

.summary-item:last-child{
    border-bottom:none;
}

.summary-value{
    color:#d4af37;
    font-weight:bold;
}

.warning{
    color:#ff4d4d;
    font-weight:bold;
    text-align:center;
    margin-top:12px;
}

.success{
    color:#38d66b;
    font-weight:bold;
    text-align:center;
    margin-top:12px;
}

/* زر الحفظ */

.save-btn{
    width:100%;
    margin-top:22px;
    padding:18px;
    border:none;
    border-radius:15px;
    background:#d4af37;
    color:#111;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.save-message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="product-page">

<h1 class="title">
📦 إضافة موديل
</h1>

<div class="form-box">


<!-- صورة الموديل -->

<div class="image-box">

    <div class="image-preview" id="imagePreview">
        <span>📷 صورة الموديل</span>
    </div>

    <input
        class="image-input"
        id="productImage"
        type="file"
        accept="image/*"
        onchange="previewImage(event)"
    >

</div>


<!-- رقم الموديل -->

<div class="field">

    <label>🔢 رقم الموديل</label>

    <input
        id="model"
        type="text"
        placeholder="مثال: 201"
    >

</div>


<!-- المورد -->

<div class="field">

    <label>🚚 اسم المورد</label>

    <input
        id="supplier"
        type="text"
        placeholder="اسم المورد"
    >

</div>


<!-- إجمالي الكراتين -->

<div class="field">

    <label>📦 إجمالي عدد الكراتين</label>

    <input
        id="totalCartons"
        type="number"
        min="0"
        step="1"
        inputmode="numeric"
        placeholder="مثال: 100"
        oninput="calculate()"
    >

</div>


<!-- الألوان -->

<div class="field">

    <div class="color-title">
        🎨 ألوان الموديل والمخزون
    </div>

    <div id="colors"></div>

    <button
        type="button"
        class="add-color"
        onclick="addColor()"
    >
        ➕ إضافة لون
    </button>

</div>


<!-- عدد الأزواج -->

<div class="field">

    <label>👞 عدد الأزواج داخل الكرتونة</label>

    <input
        id="pairsPerCarton"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        placeholder="مثال: 8"
        oninput="calculate()"
    >

</div>


<!-- سعر الزوج -->

<div class="field">

    <label>💵 سعر رأس المال للزوج بالدولار</label>

    <input
        id="costPerPair"
        type="number"
        min="0"
        step="0.01"
        inputmode="decimal"
        placeholder="مثال: 6.5"
        oninput="calculate()"
    >

</div>


<!-- الحسابات -->

<div class="summary">

    <div class="summary-item">
        <span>📦 إجمالي الكراتين</span>

        <span
            id="totalCartonsDisplay"
            class="summary-value"
        >
            0
        </span>
    </div>


    <div class="summary-item">
        <span>🎨 مجموع كراتين الألوان</span>

        <span
            id="colorCartonsDisplay"
            class="summary-value"
        >
            0
        </span>
    </div>


    <div class="summary-item">
        <span>👞 إجمالي الأزواج</span>

        <span
            id="totalPairsDisplay"
            class="summary-value"
        >
            0
        </span>
    </div>


    <div class="summary-item">
        <span>💰 إجمالي رأس المال</span>

        <span
            id="totalCapitalDisplay"
            class="summary-value"
        >
            $0.00
        </span>
    </div>


    <div id="validationMessage"></div>

</div>


<!-- زر الحفظ -->

<button
    type="button"
    class="save-btn"
    onclick="saveProduct()"
>
    💾 حفظ الموديل
</button>

<div
    id="saveMessage"
    class="save-message"
></div>


</div>

</div>


<script>

/* =========================
   صورة الموديل
========================= */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            document.getElementById(
                "imagePreview"
            ).innerHTML = `
                <img
                    src="${e.target.result}"
                    alt="صورة الموديل"
                >
            `;

        };

    reader.readAsDataURL(file);
}


/* =========================
   خيارات الألوان
========================= */

function colorOptions(){

    return `
        <option value="">اختر اللون</option>
        <option value="أسود">أسود</option>
        <option value="بني">بني</option>
        <option value="عسلي">عسلي</option>
        <option value="موغا">موغا</option>
        <option value="أبيض">أبيض</option>
        <option value="بيج">بيج</option>
        <option value="كحلي">كحلي</option>
        <option value="رمادي">رمادي</option>
        <option value="أحمر">أحمر</option>
        <option value="أخضر">أخضر</option>
        <option value="أزرق">أزرق</option>
    `;

}


/* =========================
   إضافة لون
========================= */

function addColor(){

    const container =
        document.getElementById("colors");

    const row =
        document.createElement("div");

    row.className =
        "color-row";

    row.innerHTML = `

        <div class="color-top">

            <div class="color-name">

                <select
                    onchange="calculate()"
                >
                    ${colorOptions()}
                </select>

            </div>

            <button
                type="button"
                class="delete-color"
                onclick="
                    this.closest('.color-row').remove();
                    calculate();
                "
            >
                ×
            </button>

        </div>


        <div class="color-stock">

            <button
                type="button"
                class="stock-btn minus-btn"
                onclick="
                    changeColorQuantity(this,-1)
                "
            >
                −
            </button>


            <div>

                <input
                    class="quantity"
                    type="number"
                    min="0"
                    step="1"
                    value="0"
                    inputmode="numeric"
                    oninput="calculate()"
                >

                <div class="quantity-label">
                    عدد الكراتين
                </div>

            </div>


            <button
                type="button"
                class="stock-btn plus-btn"
                onclick="
                    changeColorQuantity(this,1)
                "
            >
                +
            </button>

        </div>

    `;

    container.appendChild(row);

    calculate();

}


/* =========================
   + و -
========================= */

function changeColorQuantity(
    button,
    amount
){

    const row =
        button.closest(".color-row");

    const input =
        row.querySelector(".quantity");

    let value =
        Number(input.value) || 0;

    value += amount;

    if(value < 0){
        value = 0;
    }

    input.value = value;

    calculate();

}


/* =========================
   الحسابات
========================= */

function calculate(){

    const totalCartons =
        Number(
            document.getElementById(
                "totalCartons"
            ).value
        ) || 0;


    const pairsPerCarton =
        Number(
            document.getElementById(
                "pairsPerCarton"
            ).value
        ) || 0;


    const costPerPair =
        Number(
            document.getElementById(
                "costPerPair"
            ).value
        ) || 0;


    let colorCartons = 0;


    document
        .querySelectorAll(
            "#colors .color-row"
        )
        .forEach(row => {

            const input =
                row.querySelector(
                    ".quantity"
                );

            colorCartons +=
                Number(input.value) || 0;

        });


    const totalPairs =
        totalCartons *
        pairsPerCarton;


    const totalCapital =
        totalPairs *
        costPerPair;


    document.getElementById(
        "totalCartonsDisplay"
    ).textContent =
        totalCartons;


    document.getElementById(
        "colorCartonsDisplay"
    ).textContent =
        colorCartons;


    document.getElementById(
        "totalPairsDisplay"
    ).textContent =
        totalPairs;


    document.getElementById(
        "totalCapitalDisplay"
    ).textContent =
        "$" +
        totalCapital.toFixed(2);


    const message =
        document.getElementById(
            "validationMessage"
        );


    if(totalCartons === 0){

        message.className = "";

        message.textContent = "";

        return;

    }


    if(colorCartons === totalCartons){

        message.className =
            "success";

        message.textContent =
            "✅ مجموع الألوان مطابق لعدد الكراتين";

    }else{

        message.className =
            "warning";

        message.textContent =
            "❌ مجموع كراتين الألوان يجب أن يساوي إجمالي الكراتين";

    }

}


/* =========================
   الحفظ - سنربطه بـ Firebase بالخطوة التالية
========================= */

function saveProduct(){

    const totalCartons =
        Number(
            document.getElementById(
                "totalCartons"
            ).value
        ) || 0;


    let colorCartons = 0;


    document
        .querySelectorAll(
            "#colors .color-row"
        )
        .forEach(row => {

            const input =
                row.querySelector(
                    ".quantity"
                );

            colorCartons +=
                Number(input.value) || 0;

        });


    if(
        totalCartons !== colorCartons
    ){

        alert(
            "لا يمكن الحفظ: مجموع كراتين الألوان غير مطابق لإجمالي الكراتين."
        );

        return;

    }


    document.getElementById(
        "saveMessage"
    ).textContent =
        "⚠️ زر الحفظ جاهز، وبالخطوة التالية سنربطه مع Firebase.";

}


/* إضافة أول لون */

addColor();

</script>

</body>

</html>
