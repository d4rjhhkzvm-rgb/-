<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CENTER ALBAZIKI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#111;
color:white;
font-family:Arial;
margin:0;
}

.container{
padding:20px;
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#d4af37;
margin:20px;
}


.user-box{
background:#1d1d1d;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}


.search{
width:100%;
padding:15px;
border-radius:15px;
border:none;
font-size:17px;
margin-bottom:20px;
}


.cards{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

}


.card{

background:#1d1d1d;
border:1px solid #d4af37;
border-radius:20px;
padding:20px;
text-align:center;

}


.card span{

font-size:35px;

}


.card h2{

color:#d4af37;

}



.buttons{

margin-top:30px;

display:grid;
gap:15px;

}



button{

padding:18px;
border:none;
border-radius:15px;
background:#d4af37;
font-size:18px;
font-weight:bold;

}



</style>

</head>


<body>


<div class="container">


<div class="logo">
CENTER ALBAZIKI
</div>



<div class="user-box">

<h2>مرحبا 👋</h2>

<p id="username">
المستخدم
</p>

</div>



<input class="search" placeholder="🔍 ابحث عن موديل أو لون أو مورد">



<div class="cards">


<div class="card">

<span>📦</span>

<p>الموديلات</p>

<h2 id="models">0</h2>

</div>



<div class="card">

<span>🗃️</span>

<p>الكراتين</p>

<h2 id="boxes">0</h2>

</div>



<div class="card">

<span>🚚</span>

<p>الموردين</p>

<h2 id="suppliers">0</h2>

</div>



<div class="card">

<span>💰</span>

<p>المبيعات</p>

<h2 id="sales">0</h2>

</div>


</div>




<div class="buttons">


<button onclick="location.href='products.html'">
📦 إدارة المنتجات
</button>


<button onclick="location.href='suppliers.html'">
🚚 الموردين
</button>


<button onclick="location.href='sales.html'">
💰 تسجيل بيع
</button>


<button onclick="location.href='ai.html'">
🤖 المساعد الذكي
</button>



</div>


</div>



<script>


let name = localStorage.getItem("userName");


if(name){

document.getElementById("username").innerHTML=name;

}


</script>


</body>

</html>
